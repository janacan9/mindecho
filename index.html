   h('button',{class:'g',onclick:()=>{let d;try{d=JSON.parse(io.value)}catch(e){return toast('Это не JSON.')}
    if(!d||d.v!==1||!Array.isArray(d.notes)||!Array.isArray(d.tasks))return toast('Неверный формат или версия.');
    const okN=d.notes.filter(n=>n&&typeof n.id==='string'&&typeof n.text==='string'),okT=d.tasks.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string');
    const ids=new Set([...S.notes,...S.tasks].map(x=>x.id));const nn=okN.filter(n=>!ids.has(n.id)),nt=okT.filter(t=>!ids.has(t.id));
    run(async()=>{for(const n of nn)await put('notes',{title:n.text.slice(0,40),created:Date.now(),modified:Date.now(),cat:'Другое',fav:false,archived:false,source:'manual',...n});for(const t of nt)await put('tasks',{done:false,created:Date.now(),due:'',...t})},'Импорт: заметок '+nn.length+', задач '+nt.length+' (совпавшие ID пропущены)')}},'Импорт'),wipe))}
const V={home:['Главная',vHome],notes:['Заметки',vNotes],ins:['Наблюдения',vIns],tasks:['Задачи',vTasks],set:['Настройки',vSet]};
function render(){
 $('#main').replaceChildren(V[S.view][1]());
 $('#nav').replaceChildren(...Object.entries(V).map(([k,v])=>{const b=h('button',{onclick:()=>{stopRec();S.view=k;render()}},v[0]);if(k===S.view)b.setAttribute('aria-current','page');return b}));
 upd()}
function theme(){const t=st.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):st.theme;document.documentElement.dataset.theme=t}
$('#dt').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
theme();
openDB().then(d=>{db=d;return load()}).then(render).catch(()=>{render();toast('Хранилище браузера недоступно: заметки не сохранятся.')});
</script></body></html>
